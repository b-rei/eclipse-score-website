{{ $content := .Params.governance }}
<section class="about-section about-governance">
  <div class="score-shell">
    <header class="about-section-heading">
      <p class="about-eyebrow">{{ $content.eyebrow }}</p>
      <h2>{{ $content.heading }}</h2>
      <p class="about-body">{{ $content.description }}</p>
    </header>
    <div class="about-governance-grid">
      {{ range $content.groups }}
        <article class="about-governance-card">
          <span class="about-governance-number">{{ .number }}</span>
          <p class="about-governance-label">{{ .short }}</p>
          <h3>{{ .name }}</h3>
          <p class="about-body">{{ .description }}</p>
          <ul>
            {{ range .responsibilities }}<li>{{ . }}</li>{{ end }}
          </ul>
        </article>
      {{ end }}
    </div>
  </div>
</section>
