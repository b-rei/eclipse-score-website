<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="768" viewBox="0 0 1365 768" role="img" aria-labelledby="title description">
  <title id="title">Eclipse S-CORE governance: non-technical and technical structure</title>
  <desc id="description">Two parallel hierarchies. Non-technical X-CORE structure: Eclipse SDV Steering Committee, X-CORE Platform Council, and Engagement Program organizations. Technical project structure: Project Leads, Technical Leads, Eclipse S-CORE Contributors, and five open working groups: Architecture, Development Process, Infrastructure, Testing, and Marketing and Communication. The Platform Council is loosely coupled to the project through steering.</desc>
  <defs>
    <style>
      text { font-family: Manrope, "Segoe UI", sans-serif; }
      .column { fill: #f3f7fb; }
      .column-label { fill: #b84a00; font-size: 14px; font-weight: 800; letter-spacing: 1.8px; }
      .node { fill: #ffffff; stroke: #193967; stroke-width: 2.5; }
      .node-title { fill: #193967; font-size: 24px; font-weight: 700; }
      .node-copy { fill: #5c6f84; font-size: 15px; font-weight: 500; }
      .connector { fill: none; stroke: #234a78; stroke-width: 2.5; stroke-linecap: round; }
      .steering { fill: none; stroke: #e96812; stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; }
      .steering-label { fill: #b84a00; font-size: 16px; font-weight: 800; letter-spacing: 1px; }
      .groups-panel { fill: #193967; }
      .groups-heading { fill: #ffffff; font-size: 13px; font-weight: 800; letter-spacing: 1.8px; }
      .group-tile { fill: #234a78; stroke: #52739a; stroke-width: 1.25; }
      .group-label { fill: #ffffff; font-size: 14px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#e96812"/>
    </marker>
  </defs>

  <rect class="column" x="30" y="24" width="500" height="720" rx="24"/>
  <rect class="column" x="620" y="24" width="715" height="720" rx="24"/>

  <text class="column-label" x="280" y="74" text-anchor="middle">NON-TECHNICAL</text>
  <text class="column-label" x="977.5" y="74" text-anchor="middle">TECHNICAL</text>

  <path class="connector" d="M280 206v44M280 354v44"/>
  <path class="connector" d="M977.5 206v44M977.5 354v44M977.5 502v40"/>

  <path class="steering" d="M490 302h50c40 0 40-148 80-148h34" marker-end="url(#arrow)"/>
  <rect x="528" y="214" width="104" height="30" rx="15" fill="#fff0e4" stroke="#e96812" stroke-width="1.5"/>
  <text class="steering-label" x="580" y="235" text-anchor="middle">steering</text>

  <rect class="node" x="70" y="110" width="420" height="96" rx="16"/>
  <text class="node-title" x="280" y="150" text-anchor="middle">Eclipse SDV</text>
  <text class="node-copy" x="280" y="178" text-anchor="middle">Steering Committee</text>

  <rect class="node" x="70" y="250" width="420" height="104" rx="16" style="stroke:#e96812;stroke-width:3"/>
  <text class="node-title" x="280" y="293" text-anchor="middle">X-CORE Platform Council</text>
  <text class="node-copy" x="280" y="322" text-anchor="middle">Strategy and guidance</text>

  <rect class="node" x="70" y="398" width="420" height="104" rx="16"/>
  <text class="node-title" x="280" y="441" text-anchor="middle">Engagement Program</text>
  <text class="node-copy" x="280" y="470" text-anchor="middle">Platinum, Gold, and Silver organizations</text>

  <rect class="node" x="660" y="110" width="635" height="96" rx="16"/>
  <text class="node-title" x="977.5" y="150" text-anchor="middle">Project Leads</text>
  <text class="node-copy" x="977.5" y="178" text-anchor="middle">Project direction and coordination</text>

  <rect class="node" x="660" y="250" width="635" height="104" rx="16"/>
  <text class="node-title" x="977.5" y="293" text-anchor="middle">Technical Leads</text>
  <text class="node-copy" x="977.5" y="322" text-anchor="middle">Technical alignment and planning</text>

  <rect class="node" x="660" y="398" width="635" height="104" rx="16"/>
  <text class="node-title" x="977.5" y="441" text-anchor="middle">Eclipse S-CORE Contributors</text>
  <text class="node-copy" x="977.5" y="470" text-anchor="middle">Contribute, collaborate, and shape the project</text>

  <rect class="groups-panel" x="660" y="542" width="635" height="176" rx="20"/>
  <text class="groups-heading" x="977.5" y="574" text-anchor="middle">OPEN WORKING GROUPS</text>
  <g>
    <rect class="group-tile" x="676" y="592" width="197" height="52" rx="11"/>
    <circle cx="694" cy="618" r="7" fill="#e96812"/>
    <text class="group-label" x="708" y="623">Architecture</text>

    <rect class="group-tile" x="879" y="592" width="197" height="52" rx="11"/>
    <circle cx="897" cy="618" r="7" fill="#e96812"/>
    <text class="group-label" x="911" y="623">Development process</text>

    <rect class="group-tile" x="1082" y="592" width="197" height="52" rx="11"/>
    <circle cx="1100" cy="618" r="7" fill="#e96812"/>
    <text class="group-label" x="1114" y="623">Infrastructure</text>

    <rect class="group-tile" x="745" y="654" width="200" height="52" rx="11"/>
    <circle cx="765" cy="680" r="7" fill="#e96812"/>
    <text class="group-label" x="781" y="685">Testing</text>

    <rect class="group-tile" x="955" y="654" width="260" height="52" rx="11"/>
    <circle cx="975" cy="680" r="7" fill="#e96812"/>
    <text class="group-label" x="991" y="685">Marketing &amp; Communication</text>
  </g>
</svg>
