<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">Eclipse S-CORE 0.10 milestone</title>
  <desc id="description">A milestone-focused graphic highlighting per-module testing, stakeholder-linked integration tests, and CI-generated software bills of materials. The version number is secondary.</desc>
  <style>
    @font-face {
      font-family: Manrope;
      src: url("../../fonts/manrope/manrope-latin.woff2") format("woff2");
      font-weight: 100 900;
    }
    text { font-family: Manrope, Arial, sans-serif; }
  </style>
  <rect width="1600" height="480" fill="#f1f6f8" />
  <path d="M0 0h520v480H0z" fill="#15334c" />
  <path d="M0 0h12v480H0z" fill="#e47732" />
  <path d="M462 0h58v480h-58z" fill="#1d4660" />

