    <text x="606" y="284" fill="#496174" font-size="16" font-weight="500">Run each module in its own</text>
    <text x="606" y="307" fill="#496174" font-size="16" font-weight="500">workspace against pinned</text>
    <text x="606" y="330" fill="#496174" font-size="16" font-weight="500">integration dependencies.</text>
