  <text x="66" y="330" fill="#e7f0f3" font-size="21" font-weight="600">verification workflow.</text>
  <text x="66" y="428" fill="#b9ccd5" font-size="15" font-weight="600">MODULES  /  INTEGRATION  /  TOOLING</text>

  <text x="574" y="69" fill="#15334c" font-size="21" font-weight="800">MILESTONE HIGHLIGHTS</text>
  <circle cx="548" cy="62" r="7" fill="#e47732" />

  <g>
    <rect x="574" y="100" width="300" height="294" rx="12" fill="#ffffff" stroke="#d5e0e6" stroke-width="2" />
    <path d="M586 101h276" stroke="#008f83" stroke-width="6" />
    <rect x="606" y="126" width="24" height="24" rx="5" fill="#008f83" />
    <rect x="638" y="126" width="24" height="24" rx="5" fill="#9bd8ce" />
    <rect x="606" y="158" width="24" height="24" rx="5" fill="#9bd8ce" />
