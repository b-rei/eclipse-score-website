<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="768" viewBox="0 0 1365 768" role="img" aria-labelledby="title description">
  <title id="title">Eclipse S-CORE project leadership and working groups</title>
  <desc id="description">The X-CORE Platform Council provides strategy and guidance. Project Leads and Technical Leads coordinate the project and technical planning. Eclipse S-CORE contributors collaborate through five open working groups: Architecture, Development Process, Infrastructure, Testing, and Marketing and Communication.</desc>
  <defs>
    <style>
      text { font-family: Manrope, "Segoe UI", sans-serif; }
      .node { fill: #ffffff; stroke: #193967; stroke-width: 2.5; }
      .node-title { fill: #193967; font-size: 24px; font-weight: 700; }
      .node-copy { fill: #5c6f84; font-size: 15px; font-weight: 500; }
      .connector { fill: none; stroke: #234a78; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .connector-accent { fill: none; stroke: #e96812; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .panel-back { fill: #f3f7fb; }
      .groups-panel { fill: #193967; }
      .groups-heading { fill: #ffffff; font-size: 13px; font-weight: 800; letter-spacing: 1.8px; }
      .group-tile { fill: #234a78; stroke: #52739a; stroke-width: 1.25; }
      .group-label { fill: #ffffff; font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect class="panel-back" x="0" y="490" width="1365" height="250" rx="24"/>

