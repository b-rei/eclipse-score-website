<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540" role="img" aria-labelledby="title description">
  <title id="title">Eclipse S-CORE News and Events page concept</title>
  <desc id="description">A desktop design concept with shared navigation, a compact News and Events title band, tabs for Conferences, Press Releases, Articles and News, and Townhalls, a filterable upcoming-events feed, and a recent conferences archive.</desc>
  <defs>
    <linearGradient id="top-rule" x1="0" x2="1">
      <stop offset="0" stop-color="#0078c8"/>
      <stop offset="0.56" stop-color="#d96621"/>
      <stop offset="1" stop-color="#e96812"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#193967" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: Manrope, "Segoe UI", sans-serif; }
      .nav { fill: #234a78; font-size: 14px; font-weight: 700; }
      .nav-active { fill: #193967; font-size: 14px; font-weight: 800; }
      .eyebrow { fill: #ff9b54; font-size: 12px; font-weight: 800; letter-spacing: 2px; }
      .hero-title { fill: #ffffff; font-size: 42px; font-weight: 800; }
      .hero-copy { fill: #eaf3fb; font-size: 16px; font-weight: 500; }
      .tab { fill: #5c6f84; font-size: 14px; font-weight: 700; }
      .tab-active { fill: #193967; font-size: 14px; font-weight: 800; }
      .section-title { fill: #18385e; font-size: 25px; font-weight: 800; }
      .section-copy { fill: #5c6f84; font-size: 13px; font-weight: 500; }
      .label { fill: #b84a00; font-size: 11px; font-weight: 800; letter-spacing: 1.3px; }
      .event-title { fill: #18385e; font-size: 20px; font-weight: 800; }
      .event-copy { fill: #5c6f84; font-size: 13px; font-weight: 500; }
      .event-small-title { fill: #18385e; font-size: 14px; font-weight: 800; }
      .event-small-copy { fill: #5c6f84; font-size: 11px; font-weight: 500; }
      .filter { fill: #234a78; font-size: 12px; font-weight: 700; }
      .button-text { fill: #ffffff; font-size: 12px; font-weight: 800; }
      .archive-date { fill: #b84a00; font-size: 10px; font-weight: 800; letter-spacing: .5px; }
    </style>
  </defs>

  <rect width="1440" height="1540" fill="#f3f7fb"/>

  <!-- Shared site header -->
  <rect width="1440" height="100" fill="#ffffff"/>
  <rect x="0" y="0" width="1440" height="3" fill="url(#top-rule)"/>
  <image href="../static/images/icons/Eclipse-S-CORE-colour-horizontal.png" x="70" y="25" width="158" height="53" preserveAspectRatio="xMinYMid meet"/>
  <text class="nav" x="565" y="57">Home</text>
  <text class="nav" x="650" y="57">About</text>
  <text class="nav-active" x="730" y="57">News &amp; Events</text>
  <rect x="726" y="78" width="105" height="3" rx="1.5" fill="#e96812"/>
  <text class="nav" x="860" y="57">Documentation</text>
  <text class="nav" x="1000" y="57">Get Involved</text>
  <text class="nav" x="1118" y="57">FAQ</text>
  <rect x="1195" y="31" width="162" height="42" rx="8" fill="#0078c8"/>
  <circle cx="1218" cy="52" r="9" fill="#ffffff"/>
  <text class="button-text" x="1236" y="56">GitHub</text>

  <!-- Compact page intro keeps the event feed close to the top -->
  <rect x="0" y="100" width="1440" height="224" fill="#193967"/>
  <text class="eyebrow" x="100" y="153">STAY UP TO DATE</text>
  <text class="hero-title" x="100" y="207">News &amp; Events</text>
  <text class="hero-copy" x="100" y="246">Follow upcoming conferences, community events, project news, and townhalls.</text>
  <text class="hero-copy" x="100" y="270">Find the next opportunity to meet the Eclipse S-CORE community.</text>
  <rect x="0" y="321" width="1440" height="4" fill="#e96812"/>

  <!-- Existing sibling destinations -->
  <rect x="0" y="325" width="1440" height="72" fill="#ffffff"/>
  <text class="tab-active" x="100" y="369">Conferences</text>
  <rect x="96" y="393" width="107" height="4" rx="2" fill="#e96812"/>
  <text class="tab" x="260" y="369">Press Releases</text>
  <text class="tab" x="440" y="369">Articles &amp; News</text>
  <text class="tab" x="640" y="369">Townhalls</text>
  <line x1="0" y1="396" x2="1440" y2="396" stroke="#d9e3ec"/>

  <!-- Upcoming event feed -->
  <text class="section-title" x="100" y="461">Upcoming events</text>
  <text class="section-copy" x="100" y="487">Live listings from the Eclipse Foundation event feed</text>

  <rect x="100" y="515" width="180" height="40" rx="6" fill="#b84a00"/>
  <text class="button-text" x="128" y="540">Upcoming</text>
  <rect x="280" y="515" width="145" height="40" rx="6" fill="#ffffff" stroke="#d6e1eb"/>
  <text class="filter" x="318" y="540">Past events</text>
  <rect x="697" y="515" width="245" height="40" rx="6" fill="#ffffff" stroke="#d6e1eb"/>
  <text class="filter" x="716" y="540">All event types</text>
  <path d="m910 531 6 6 6-6" fill="none" stroke="#234a78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="100" y="578" width="842" height="300" rx="9" fill="#ffffff" stroke="#dbe5ed" filter="url(#soft-shadow)"/>
  <rect x="100" y="578" width="9" height="300" rx="4" fill="#e96812"/>
  <rect x="132" y="610" width="119" height="25" rx="12.5" fill="#fff0e4"/>
  <text class="label" x="148" y="627">UPCOMING EVENT</text>
  <text x="132" y="674" fill="#193967" font-size="13" font-weight="800">06—08 OCT 2026</text>
  <text class="event-title" x="132" y="717">Eclipse SDV Hackathon Chapter Four</text>
  <circle cx="140" cy="753" r="5" fill="#0078c8"/>
  <text class="event-copy" x="154" y="758">Friedrichshafen, Germany</text>
  <text class="event-copy" x="132" y="797">Use Eclipse SDV projects to solve real automotive challenges.</text>
  <rect x="132" y="824" width="126" height="38" rx="6" fill="#b84a00"/>
  <text class="button-text" x="153" y="848">View event</text>
  <rect x="713" y="610" width="197" height="236" rx="7" fill="#eaf3f9"/>
  <circle cx="811" cy="710" r="45" fill="#ffffff"/>
  <path d="M787 710h48M811 686v48" stroke="#0078c8" stroke-width="3" stroke-linecap="round"/>
  <text x="811" y="782" text-anchor="middle" fill="#5c6f84" font-size="11" font-weight="700">EVENT DETAILS</text>

  <!-- Recently held conferences archive -->
  <rect x="975" y="461" width="365" height="417" rx="9" fill="#ffffff" stroke="#dbe5ed" filter="url(#soft-shadow)"/>
  <text class="section-title" x="1002" y="502" font-size="20">Recent conferences</text>
  <text class="section-copy" x="1002" y="524">Past events and their resources</text>
  <line x1="1002" y1="544" x2="1313" y2="544" stroke="#e1e8ef"/>

  <rect x="1002" y="561" width="65" height="48" rx="5" fill="#193967"/>
  <text x="1034" y="581" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">21—23</text>
  <text x="1034" y="597" text-anchor="middle" fill="#ff9b54" font-size="9" font-weight="800">APR 2026</text>
  <text class="event-small-title" x="1081" y="577">OCX 2026</text>
  <text class="event-small-copy" x="1081" y="596">Brussels, Belgium</text>
  <image href="../static/images/news/OCX26.png" x="1248" y="565" width="65" height="42" preserveAspectRatio="xMidYMid meet"/>
  <line x1="1002" y1="624" x2="1313" y2="624" stroke="#e1e8ef"/>

  <rect x="1002" y="641" width="65" height="48" rx="5" fill="#193967"/>
  <text x="1034" y="661" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">24—26</text>
  <text x="1034" y="677" text-anchor="middle" fill="#ff9b54" font-size="9" font-weight="800">MAR 2026</text>
  <text class="event-small-title" x="1081" y="657">Open Chain &amp; Friends</text>
  <text class="event-small-copy" x="1081" y="676">Stuttgart, Germany</text>
  <line x1="1002" y1="704" x2="1313" y2="704" stroke="#e1e8ef"/>

  <rect x="1002" y="721" width="65" height="48" rx="5" fill="#193967"/>
  <text x="1034" y="741" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="800">24</text>
  <text x="1034" y="757" text-anchor="middle" fill="#ff9b54" font-size="9" font-weight="800">FEB 2026</text>
  <text class="event-small-title" x="1081" y="737">SDV Community Days</text>
  <text class="event-small-copy" x="1081" y="756">Bonn, Germany</text>
  <line x1="1002" y1="784" x2="1313" y2="784" stroke="#e1e8ef"/>

  <text x="1002" y="826" fill="#b84a00" font-size="12" font-weight="800">Browse event archive</text>
  <path d="m1150 820 7 6-7 6" fill="none" stroke="#b84a00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Feed pagination -->
  <line x1="100" y1="921" x2="942" y2="921" stroke="#d6e1eb"/>
  <text x="100" y="959" fill="#5c6f84" font-size="12" font-weight="600">Showing upcoming events</text>
  <g>
    <rect x="784" y="938" width="34" height="34" rx="5" fill="#b84a00"/>
    <text x="801" y="960" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">1</text>
    <rect x="826" y="938" width="34" height="34" rx="5" fill="#ffffff" stroke="#d6e1eb"/>
    <text x="843" y="960" text-anchor="middle" fill="#234a78" font-size="12" font-weight="700">2</text>
    <rect x="868" y="938" width="34" height="34" rx="5" fill="#ffffff" stroke="#d6e1eb"/>
    <text x="885" y="960" text-anchor="middle" fill="#234a78" font-size="12" font-weight="700">3</text>
    <text x="918" y="960" fill="#234a78" font-size="15" font-weight="700">›</text>
  </g>

  <!-- Lower continuation: keep content destinations visible -->
  <rect x="100" y="1030" width="1240" height="1" fill="#d6e1eb"/>
  <text class="eyebrow" x="100" y="1082" fill="#b84a00">MORE FROM S-CORE</text>
  <text class="section-title" x="100" y="1122">Stories, announcements, and community sessions</text>
  <text class="section-copy" x="100" y="1150">The section tabs above keep these related destinations one click away.</text>

  <rect x="100" y="1190" width="390" height="150" rx="8" fill="#ffffff" stroke="#dbe5ed"/>
  <text class="label" x="126" y="1225">PRESS RELEASES</text>
  <text class="event-small-title" x="126" y="1260" font-size="16">Project announcements</text>
  <text class="event-small-copy" x="126" y="1284">Official releases and milestones</text>
  <text x="126" y="1318" fill="#b84a00" font-size="12" font-weight="800">Browse releases →</text>

  <rect x="525" y="1190" width="390" height="150" rx="8" fill="#ffffff" stroke="#dbe5ed"/>
  <text class="label" x="551" y="1225">ARTICLES &amp; NEWS</text>
  <text class="event-small-title" x="551" y="1260" font-size="16">Insights from the project</text>
  <text class="event-small-copy" x="551" y="1284">Stories, updates, and perspectives</text>
  <text x="551" y="1318" fill="#b84a00" font-size="12" font-weight="800">Read articles →</text>

  <rect x="950" y="1190" width="390" height="150" rx="8" fill="#ffffff" stroke="#dbe5ed"/>
  <text class="label" x="976" y="1225">TOWNHALLS</text>
  <text class="event-small-title" x="976" y="1260" font-size="16">Meet the S-CORE community</text>
  <text class="event-small-copy" x="976" y="1284">Recordings and upcoming sessions</text>
  <text x="976" y="1318" fill="#b84a00" font-size="12" font-weight="800">Explore townhalls →</text>

  <rect x="0" y="1400" width="1440" height="140" fill="#193967"/>
  <text x="100" y="1457" fill="#ffffff" font-size="13" font-weight="700">Copyright © Eclipse Foundation AISBL</text>
  <text x="1110" y="1457" fill="#ffffff" font-size="12" font-weight="600">Terms</text>
  <text x="1180" y="1457" fill="#ffffff" font-size="12" font-weight="600">Privacy</text>
  <text x="1270" y="1457" fill="#ffffff" font-size="12" font-weight="600">Legal</text>
</svg>