  <text x="80" y="814" fill="#18385e" font-size="24" font-weight="800">What the roadmap is aiming for</text>
  <text x="80" y="841" fill="#5c6f84" font-size="14" font-weight="500">Two outcomes guide the work toward v1.0.</text>
  <g>
    <rect x="80" y="873" width="618" height="130" rx="8" fill="#ffffff" stroke="#dce4ec" />
    <path d="M80 873v130" stroke="#42c5e8" stroke-width="5" />
