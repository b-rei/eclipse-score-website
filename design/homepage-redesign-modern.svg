<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1900" viewBox="0 0 1440 1900" role="img" aria-labelledby="title desc">
  <title id="title">Modern S-CORE homepage concept</title>
  <desc id="desc">A more modern S-CORE homepage mockup with a large hero, sharp card grid, and streamlined platform overview.</desc>
  <defs>
    <linearGradient id="bgHero" x1="0" x2="1">
      <stop offset="0%" stop-color="#0c3e63"/>
      <stop offset="50%" stop-color="#0b4e74"/>
      <stop offset="100%" stop-color="#0d2f4b"/>
    </linearGradient>
    <linearGradient id="navyGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f2947"/>
      <stop offset="100%" stop-color="#1a4a73"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d3d58"/>
      <stop offset="100%" stop-color="#233f59"/>
    </linearGradient>
    <linearGradient id="softGray" x1="0" x2="1">
      <stop offset="0%" stop-color="#eef4f8"/>
      <stop offset="100%" stop-color="#e5edf4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0d2340" flood-opacity="0.12"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d2340" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .nav { font-size: 14px; fill: #39506e; font-weight: 700; }
      .eyebrow { font-size: 12px; letter-spacing: 2.5px; fill: #6bd5f5; font-weight: 700; }
      .whiteEyebrow { font-size: 12px; letter-spacing: 2.5px; fill: #8eb5d9; font-weight: 700; }
      .heroTitle { font-size: 62px; font-weight: 700; fill: #f7fbff; }
      .heroBody { font-size: 22px; fill: rgba(236,246,255,0.92); }
      .sectionTitle { font-size: 30px; font-weight: 700; fill: #122845; }
      .cardTitle { font-size: 20px; fill: #122845; font-weight: 700; }
      .cardText { font-size: 14px; fill: #53657e; }
      .darkCardText { font-size: 15px; fill: rgba(220,236,251,0.9); }
      .body { font-size: 16px; fill: #4f6279; }
      .small { font-size: 12px; fill: #6a7d93; font-weight: 700; }
      .link { font-size: 14px; font-weight: 700; fill: #1d5ea3; }
      .muted { fill: rgba(255,255,255,0.8); }
      .blue { fill: #1f6fb7; }
      .brandBlue { fill: #1c5e9f; }
      .cyan { fill: #67d9f6; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1440" height="1900" fill="#edf2f5"/>

  <g>
    <rect x="72" y="48" width="1296" height="772" rx="26" fill="#ffffff" filter="url(#softShadow)"/>
    <rect x="72" y="48" width="1296" height="86" rx="26" fill="#ffffff"/>
    <rect x="72" y="134" width="1296" height="686" rx="0" fill="url(#bgHero)"/>
    <g opacity="0.7">
      <circle cx="980" cy="165" r="120" fill="#8fe6ff" opacity="0.07"/>
      <circle cx="1055" cy="240" r="70" fill="#8fe6ff" opacity="0.08"/>
      <circle cx="1170" cy="200" r="100" fill="#8fe6ff" opacity="0.08"/>
      <path d="M760 270 L1450 235" stroke="#73d6ef" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>
      <path d="M700 350 L1370 300" stroke="#73d6ef" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>
      <path d="M740 420 L1360 390" stroke="#73d6ef" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>
      <g fill="#d9f8ff" opacity="0.8">
        <circle cx="838" cy="230" r="3"/>
        <circle cx="930" cy="250" r="3"/>
        <circle cx="1010" cy="207" r="3"/>
        <circle cx="1095" cy="255" r="3"/>
        <circle cx="1186" cy="212" r="3"/>
        <circle cx="1260" cy="280" r="3"/>
        <circle cx="880" cy="332" r="3"/>
        <circle cx="970" cy="342" r="3"/>
        <circle cx="1065" cy="312" r="3"/>
        <circle cx="1158" cy="356" r="3"/>
        <circle cx="1248" cy="336" r="3"/>
      </g>
    </g>

    <g transform="translate(120 52)">
      <g transform="translate(0 8)">
        <path d="M18 48 L64 54 L84 66 L40 61 Z" fill="#173d65"/>
        <path d="M40 62 L85 69 L62 90 L18 83 Z" fill="#1f6bb3"/>
        <path d="M18 83 L40 62 L46 64 L32 81 L62 85 L53 94 Z" fill="#153d64"/>
      </g>
      <text x="108" y="34" font-size="11" letter-spacing="5" fill="#1d3958" font-weight="700">ECLIPSE</text>
      <text x="108" y="70" font-size="27" letter-spacing="1" fill="#1d5fa6" font-weight="700">S-CORE</text>
    </g>

    <g font-size="14" font-weight="700" fill="#2c4f74">
      <text x="620" y="94">About</text>
      <text x="700" y="94">News &amp; Events</text>
      <text x="835" y="94">Documentation</text>
      <text x="987" y="94">Get Involved</text>
    </g>

    <rect x="1188" y="57" width="114" height="38" rx="8" fill="#1d5ea3"/>
    <text x="1245" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GitHub</text>

    <g transform="translate(134 206)">
      <text class="eyebrow" x="0" y="0">ECLIPSE SAFE OPEN VEHICLE CORE</text>
      <text class="heroTitle" x="0" y="98">Open by Choice.</text>
      <text class="heroTitle" x="0" y="170">Safe by Design.</text>
      <text class="heroBody" x="0" y="220">An open, safety-oriented software platform for</text>
      <text class="heroBody" x="0" y="252">software-defined vehicles, developed through</text>
      <text class="heroBody" x="0" y="284">collaboration across the automotive ecosystem.</text>
      <rect x="0" y="322" width="172" height="52" rx="8" fill="#67d9f6"/>
      <text x="86" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#10375f">Read the Guide</text>
      <rect x="192" y="322" width="178" height="52" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.45)"/>
      <text x="281" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Get Involved</text>
      <text x="400" y="354" font-size="18" font-weight="700" fill="#dff5ff">Explore GitHub →</text>
    </g>

    <g transform="translate(850 230)">
      <g opacity="0.55" stroke="#9feefe" stroke-width="1.2">
        <path d="M0 10 L80 60 L150 30 L210 80" fill="none"/>
        <path d="M40 120 L120 55 L190 115 L245 82" fill="none"/>
        <path d="M50 0 L130 90 L220 55" fill="none"/>
      </g>
      <g fill="#dff9ff" opacity="0.9">
        <circle cx="52" cy="78" r="5"/>
        <circle cx="111" cy="58" r="5"/>
        <circle cx="170" cy="80" r="5"/>
        <circle cx="142" cy="140" r="5"/>
        <circle cx="222" cy="116" r="5"/>
      </g>
      <g filter="url(#smallShadow)">
        <rect x="20" y="120" width="208" height="122" rx="18" fill="#d9f7ff" opacity="0.2"/>
        <rect x="38" y="148" width="170" height="30" rx="15" fill="#5ad7f4" opacity="0.7"/>
        <rect x="32" y="185" width="184" height="32" rx="16" fill="#6ad8ef" opacity="0.65"/>
      </g>
    </g>
  </g>

  <g transform="translate(72 885)">
    <text class="whiteEyebrow" x="66" y="60">START HERE</text>
    <text class="sectionTitle" x="66" y="110">Find your way into S-CORE</text>
    <g transform="translate(0 150)">
      <g transform="translate(0 0)" filter="url(#smallShadow)">
        <rect width="214" height="196" rx="18" fill="#ffffff"/>
        <rect x="0" y="0" width="214" height="196" rx="18" fill="#f7fafc"/>
        <rect x="32" y="34" width="58" height="58" rx="12" fill="#d7edf7"/>
        <path d="M48 58 L70 58 L70 78 L48 78 Z" fill="#1d5ea3"/>
        <path d="M42 69 L70 69 L70 82 L42 82 Z" fill="#1d5ea3"/>
        <path d="M38 48 L72 48 L72 54 L38 54 Z" fill="#1d5ea3"/>
        <text class="cardTitle" x="32" y="122">User guide</text>
        <text class="cardText" x="32" y="152">Build your first</text>
        <text class="cardText" x="32" y="171">application</text>
      </g>

      <g transform="translate(245 0)" filter="url(#smallShadow)">
        <rect width="214" height="196" rx="18" fill="#ffffff"/>
        <rect x="0" y="0" width="214" height="196" rx="18" fill="#f7fafc"/>
        <rect x="32" y="34" width="58" height="58" rx="12" fill="#d7edf7"/>
        <path d="M44 80 L70 48 L92 80 Z" fill="#1d5ea3"/>
        <path d="M45 82 L70 62 L92 82" stroke="#1d5ea3" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M55 80 L55 92" stroke="#1d5ea3" stroke-width="4" stroke-linecap="round"/>
        <path d="M85 80 L85 92" stroke="#1d5ea3" stroke-width="4" stroke-linecap="round"/>
        <text class="cardTitle" x="32" y="122">Releases</text>
        <text class="cardText" x="32" y="152">Review current</text>
        <text class="cardText" x="32" y="171">milestones</text>
      </g>

      <g transform="translate(490 0)" filter="url(#smallShadow)">
        <rect width="214" height="196" rx="18" fill="#ffffff"/>
        <rect x="0" y="0" width="214" height="196" rx="18" fill="#f7fafc"/>
        <rect x="32" y="34" width="58" height="58" rx="12" fill="#d7edf7"/>
        <circle cx="61" cy="63" r="14" fill="none" stroke="#1d5ea3" stroke-width="4"/>
        <path d="M61 45 L61 49 M61 77 L61 81 M43 63 L47 63 M75 63 L79 63 M48 49 L51 52 M71 52 L74 49 M48 77 L51 74 M71 74 L74 77" stroke="#1d5ea3" stroke-width="3" stroke-linecap="round"/>
        <text class="cardTitle" x="32" y="122">Extensibility</text>
        <text class="cardText" x="32" y="152">Hardware and</text>
        <text class="cardText" x="32" y="171">software layers</text>
      </g>

      <g transform="translate(735 0)" filter="url(#smallShadow)">
        <rect width="214" height="196" rx="18" fill="#ffffff"/>
        <rect x="0" y="0" width="214" height="196" rx="18" fill="#f7fafc"/>
        <rect x="32" y="34" width="58" height="58" rx="12" fill="#d7edf7"/>
        <path d="M50 47 L70 47 L77 68 L78 82 L42 82 L43 68 Z" fill="#1d5ea3"/>
        <path d="M42 82 L78 82 L70 92 L50 92 Z" fill="#1d5ea3"/>
        <path d="M60 60 L61 47 M61 60 L72 60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <text class="cardTitle" x="32" y="122">Functional Safety</text>
        <text class="cardText" x="32" y="152">Readable</text>
        <text class="cardText" x="32" y="171">specifications</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 1240)">
    <text class="whiteEyebrow" x="66" y="33">WHY S-CORE</text>
    <text class="sectionTitle" x="66" y="78">A shared foundation for vehicle software</text>
    <g transform="translate(0 120)">
      <g transform="translate(0 0)" filter="url(#smallShadow)">
        <rect width="216" height="176" rx="20" fill="url(#cardDark)"/>
        <circle cx="44" cy="46" r="18" fill="#67d9f6" opacity="0.9"/>
        <text x="44" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#0f2944">01</text>
        <text class="cardTitle" x="30" y="98" fill="#f4fafe">Collaboration</text>
        <text class="darkCardText" x="30" y="128">One common stack</text>
        <text class="darkCardText" x="30" y="149">for shared industry</text>
        <text class="darkCardText" x="30" y="170">problems.</text>
      </g>

      <g transform="translate(244 0)" filter="url(#smallShadow)">
        <rect width="216" height="176" rx="20" fill="#ffffff"/>
        <circle cx="44" cy="46" r="18" fill="#e9f4ff"/>
        <path d="M38 46 L43 52 L52 38" stroke="#1d5ea3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="cardTitle" x="30" y="98">Speed</text>
        <text class="cardText" x="30" y="128">Code-centric,</text>
        <text class="cardText" x="30" y="149">iterative work in</text>
        <text class="cardText" x="30" y="170">the open.</text>
      </g>

      <g transform="translate(488 0)" filter="url(#smallShadow)">
        <rect width="216" height="176" rx="20" fill="#ffffff"/>
        <circle cx="44" cy="46" r="18" fill="#e9f4ff"/>
        <circle cx="44" cy="46" r="8" fill="#1d5ea3"/>
        <path d="M44 23 L44 30 M44 62 L44 69 M21 46 L28 46 M60 46 L67 46 M27 29 L32 34 M56 58 L61 63 M27 63 L32 58 M56 34 L61 29" stroke="#1d5ea3" stroke-width="3" stroke-linecap="round"/>
        <text class="cardTitle" x="30" y="98">Extensibility</text>
        <text class="cardText" x="30" y="128">Hardware and</text>
        <text class="cardText" x="30" y="149">software layers</text>
        <text class="cardText" x="30" y="170">stay decoupled.</text>
      </g>

      <g transform="translate(732 0)" filter="url(#smallShadow)">
        <rect width="216" height="176" rx="20" fill="#ffffff"/>
        <circle cx="44" cy="46" r="18" fill="#e9f4ff"/>
        <path d="M33 46 L41 54 L57 38" stroke="#1d5ea3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="cardTitle" x="30" y="98">Quality</text>
        <text class="cardText" x="30" y="128">Readable specs</text>
        <text class="cardText" x="30" y="149">and disciplined</text>
        <text class="cardText" x="30" y="170">engineering.</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 1510)">
    <rect x="0" y="0" width="1296" height="268" rx="30" fill="#ffffff" filter="url(#softShadow)"/>
    <g transform="translate(64 52)">
      <text class="whiteEyebrow" x="0" y="8" fill="#2d6898">THE PLATFORM</text>
      <text class="sectionTitle" x="0" y="62">Middleware between OS and applications</text>
      <text class="body" x="0" y="108">S-CORE is a collaborative, modular software platform for the</text>
      <text class="body" x="0" y="136">software-defined vehicle. It aims to reduce integration effort</text>
      <text class="body" x="0" y="164">and support reusable development across ECU hardware.</text>
      <text class="small" x="0" y="206">Designed for safety-critical contexts including ADAS, Body, and Chassis.</text>
      <text class="small" x="0" y="228">Supports compliance with ISO 26262 and ISO/SAE 21434.</text>
      <text class="link" x="0" y="256">Explore architecture →</text>
    </g>

    <g transform="translate(840 42)">
      <g>
        <rect x="0" y="10" width="298" height="44" rx="12" fill="#edf4fa"/>
        <text x="149" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#334c68">Vehicle applications</text>
        <rect x="0" y="68" width="298" height="72" rx="18" fill="url(#navyGlow)"/>
        <text x="149" y="102" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">S-CORE</text>
        <text x="149" y="126" text-anchor="middle" font-size="12" fill="#dfeef9">Middleware</text>
        <rect x="0" y="156" width="298" height="44" rx="12" fill="#edf4fa"/>
        <text x="149" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#334c68">Operating system</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 1820)">
    <text class="whiteEyebrow" x="66" y="20" fill="#2d6898">LATEST UPDATES</text>
    <text class="sectionTitle" x="66" y="70">News &amp; events</text>
    <g transform="translate(0 104)">
      <rect x="0" y="0" width="1296" height="110" rx="18" fill="#ffffff"/>
      <text x="36" y="42" font-size="12" font-weight="700" fill="#6e7d8f">NEWS</text>
      <text x="144" y="42" font-size="18" font-weight="700" fill="#122845">S-CORE project updates and release milestones</text>
      <text x="1170" y="42" font-size="14" font-weight="700" fill="#1d5ea3">Read updates →</text>
      <rect x="36" y="60" width="1224" height="1" fill="#e7edf4"/>
      <text x="36" y="90" font-size="12" font-weight="700" fill="#6e7d8f">COMMUNITY</text>
      <text x="144" y="90" font-size="18" font-weight="700" fill="#122845">Upcoming events and working sessions</text>
      <text x="1170" y="90" font-size="14" font-weight="700" fill="#1d5ea3">See calendar →</text>
    </g>
  </g>
</svg>
