<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">About page targets with orange signal accent</title>
  <desc id="desc">A visual proposal for the About page target section. It retains the Alt1 navy and blue structure while using warm orange for target headings and outcome metrics.</desc>
  <defs>
    <linearGradient id="top-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078c8"/>
      <stop offset="1" stop-color="#42c5e8"/>
    </linearGradient>
    <linearGradient id="icon-warm" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff0e4"/>
      <stop offset="1" stop-color="#ffd0ae"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#193967" flood-opacity=".09"/>
    </filter>
    <style>
      text { font-family: Manrope, 'Segoe UI', sans-serif; }
      .nav { fill: #234a78; font-size: 14px; font-weight: 700; }
      .eyebrow { fill: #0078c8; font-size: 13px; font-weight: 800; letter-spacing: 3px; }
      .headline { fill: #18385e; font-size: 48px; font-weight: 800; }
      .intro { fill: #5c6f84; font-size: 17px; font-weight: 500; }
      .target { fill: #e96812; font-size: 23px; font-weight: 800; }
      .body { fill: #25364a; font-size: 16px; font-weight: 500; }
      .emphasis { fill: #193967; font-size: 17px; font-weight: 800; }
      .number { fill: #8c9db0; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1440" height="1020" fill="#f3f7fb"/>

  <!-- Shared Alt1 header -->
  <rect width="1440" height="4" fill="url(#top-rule)"/>
  <rect y="4" width="1440" height="96" fill="#fff"/>
  <image x="108" y="27" width="150" height="50" preserveAspectRatio="xMinYMid meet" href="../static/images/icons/Eclipse-S-CORE-colour-horizontal.png"/>
  <g class="nav" text-anchor="middle">
    <text x="704" y="60">Home</text>
    <text x="797" y="60" fill="#193967">About</text>
    <text x="922" y="60">News &amp; Events</text>
    <text x="1062" y="60">Documentation</text>
    <text x="1191" y="60">Get Involved</text>
  </g>
  <rect x="1260" y="30" width="92" height="42" rx="7" fill="#0078c8"/>
  <text x="1306" y="56" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">GitHub</text>
  <rect x="108" y="99" width="1224" height="1" fill="#d9e4ed"/>
  <rect x="760" y="96" width="76" height="3" rx="1.5" fill="#0078c8"/>

  <!-- Section introduction -->
  <g transform="translate(108 176)">
    <text class="eyebrow" x="0" y="0">WHY WE EXIST</text>
    <text class="headline" x="0" y="62">What an open core makes possible</text>
    <text class="intro" x="0" y="103">Four outcomes. One shared foundation for automotive software.</text>
  </g>

  <!-- Target cards -->
  <g transform="translate(108 334)">
    <!-- Speed -->
    <g filter="url(#card-shadow)">
      <rect width="288" height="498" rx="10" fill="#fff" stroke="#d9e4ed"/>
      <rect width="288" height="5" rx="2.5" fill="#e96812"/>
    </g>
    <text class="number" x="22" y="34">01</text>
    <circle cx="144" cy="116" r="52" fill="url(#icon-warm)"/>
    <g transform="translate(120 92)" stroke="#193967" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M5 31a20 20 0 1 1 38 0"/>
      <path d="m24 23 12-11M9 34h31"/>
      <circle cx="24" cy="24" r="3" fill="#193967"/>
    </g>
    <text class="target" x="144" y="207" text-anchor="middle">Speed</text>
    <text class="body" x="144" y="257" text-anchor="middle">
      <tspan x="144" dy="0" font-weight="800">Accelerate development</tspan>
      <tspan x="144" dy="25">with open-source,</tspan>
      <tspan x="144" dy="24">code-centric methods.</tspan>
    </text>
    <line x1="32" y1="348" x2="256" y2="348" stroke="#e3ebf1"/>
    <text class="emphasis" x="144" y="389" text-anchor="middle">
      <tspan x="144" dy="0">Up to 30% faster</tspan>
      <tspan x="144" dy="25">time to market</tspan>
    </text>

    <!-- Efficiency -->
    <g transform="translate(312 0)" filter="url(#card-shadow)">
      <rect width="288" height="498" rx="10" fill="#fff" stroke="#d9e4ed"/>
      <rect width="288" height="5" rx="2.5" fill="#e96812"/>
    </g>
    <text class="number" x="334" y="34">02</text>
    <circle cx="456" cy="116" r="52" fill="url(#icon-warm)"/>
    <g transform="translate(432 92)" fill="none" stroke="#193967" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 11h24l-6-6M36 37H12l6 6"/>
      <path d="M35 11a17 17 0 0 1 3 22M13 37a17 17 0 0 1-3-22"/>
    </g>
    <text class="target" x="456" y="207" text-anchor="middle">
      <tspan x="456">Efficiency &amp; reuse</tspan>
    </text>
    <text class="body" x="456" y="257" text-anchor="middle">
      <tspan x="456" dy="0">Share artefacts across</tspan>
      <tspan x="456" dy="25">development, integration,</tspan>
      <tspan x="456" dy="24">and maintenance.</tspan>
    </text>
    <line x1="344" y1="348" x2="568" y2="348" stroke="#e3ebf1"/>
    <text class="emphasis" x="456" y="389" text-anchor="middle">
      <tspan x="456">Up to 40% less effort</tspan>
    </text>

    <!-- Compatibility -->
    <g transform="translate(624 0)" filter="url(#card-shadow)">
      <rect width="288" height="498" rx="10" fill="#fff" stroke="#d9e4ed"/>
      <rect width="288" height="5" rx="2.5" fill="#e96812"/>
    </g>
    <text class="number" x="646" y="34">03</text>
    <circle cx="768" cy="116" r="52" fill="url(#icon-warm)"/>
    <g transform="translate(742 94)" fill="#193967">
      <path d="m26 0 26 12-26 12L0 12 26 0Z"/>
      <path d="m0 24 26 12 26-12-7-3-19 9L7 21l-7 3Z"/>
    </g>
    <text class="target" x="768" y="207" text-anchor="middle">
      <tspan x="768">Compatibility &amp;</tspan>
      <tspan x="768" dy="28">qualification</tspan>
    </text>
    <text class="body" x="768" y="276" text-anchor="middle">
      <tspan x="768" dy="0">A compatible, resilient</tspan>
      <tspan x="768" dy="25">stack designed for reuse</tspan>
      <tspan x="768" dy="24">across vehicle programs.</tspan>
    </text>
    <line x1="656" y1="372" x2="880" y2="372" stroke="#e3ebf1"/>
    <text class="emphasis" x="768" y="413" text-anchor="middle">
      <tspan x="768">Safety-qualified to</tspan>
      <tspan x="768" dy="25">automotive standards</tspan>
    </text>

    <!-- Business model -->
    <g transform="translate(936 0)" filter="url(#card-shadow)">
      <rect width="288" height="498" rx="10" fill="#fff" stroke="#d9e4ed"/>
      <rect width="288" height="5" rx="2.5" fill="#e96812"/>
    </g>
    <text class="number" x="958" y="34">04</text>
    <circle cx="1080" cy="116" r="52" fill="url(#icon-warm)"/>
    <g transform="translate(1054 94)" fill="#193967">
      <circle cx="15" cy="8" r="7"/><circle cx="38" cy="9" r="6"/>
      <path d="M2 30c0-8 5-13 13-13s13 5 13 13v4H2v-4Zm24 0c0-7 4-11 12-11s12 4 12 11v4H26v-4Z"/>
    </g>
    <text class="target" x="1080" y="207" text-anchor="middle">
      <tspan x="1080">Business model</tspan>
    </text>
    <text class="body" x="1080" y="257" text-anchor="middle">
      <tspan x="1080" dy="0">Create services and</tspan>
      <tspan x="1080" dy="25">products around a shared</tspan>
      <tspan x="1080" dy="24">open-source platform.</tspan>
    </text>
    <line x1="968" y1="348" x2="1192" y2="348" stroke="#e3ebf1"/>
    <text class="emphasis" x="1080" y="389" text-anchor="middle">
      <tspan x="1080">Opportunities for every</tspan>
      <tspan x="1080" dy="25">ecosystem player</tspan>
    </text>
  </g>

  <text x="108" y="912" font-family="Manrope, 'Segoe UI', sans-serif" font-size="13" fill="#5c6f84">Alt1 proposal • orange used as a focused signal accent alongside S-CORE navy and blue</text>
</svg>
