<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
  <title id="title">Eclipse S-CORE News and Events concept, version 2</title>
  <desc id="description">A desktop concept using one Eclipse Foundation event feed with the verified Upcoming Events and Past Events controls, event cards, and pagination. Existing sibling destinations remain in the top tab navigation. There is no separate manually maintained conference archive.</desc>
  <defs>
    <linearGradient id="top-rule" x1="0" x2="1">
      <stop offset="0" stop-color="#0078c8"/>
      <stop offset="0.56" stop-color="#d96621"/>
      <stop offset="1" stop-color="#e96812"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#193967" flood-opacity=".07"/>
    </filter>
    <style>
      text { font-family: Manrope, "Segoe UI", sans-serif; }
      .nav { fill: #234a78; font-size: 14px; font-weight: 700; }
      .nav-active { fill: #193967; font-size: 14px; font-weight: 800; }
      .eyebrow { fill: #ff9b54; font-size: 12px; font-weight: 800; letter-spacing: 2px; }
      .hero-title { fill: #ffffff; font-size: 42px; font-weight: 800; }
      .hero-copy { fill: #eaf3fb; font-size: 16px; font-weight: 500; }
      .tab { fill: #5c6f84; font-size: 14px; font-weight: 700; }
      .tab-active { fill: #193967; font-size: 14px; font-weight: 800; }
      .section-title { fill: #18385e; font-size: 25px; font-weight: 800; }
      .section-copy { fill: #5c6f84; font-size: 13px; font-weight: 500; }
      .event-title { fill: #18385e; font-size: 19px; font-weight: 800; }
      .event-copy { fill: #5c6f84; font-size: 13px; font-weight: 500; }
      .event-date { fill: #193967; font-size: 13px; font-weight: 800; letter-spacing: .5px; }
      .event-location { fill: #5c6f84; font-size: 12px; font-weight: 700; }
      .button-text { fill: #ffffff; font-size: 12px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1440" height="1320" fill="#f3f7fb"/>

  <!-- Shared site header -->
  <rect width="1440" height="100" fill="#ffffff"/>
  <rect x="0" y="0" width="1440" height="3" fill="url(#top-rule)"/>
  <image href="../static/images/icons/Eclipse-S-CORE-colour-horizontal.png" x="70" y="25" width="158" height="53" preserveAspectRatio="xMinYMid meet"/>
  <text class="nav" x="565" y="57">Home</text>
  <text class="nav" x="650" y="57">About</text>
  <text class="nav-active" x="730" y="57">News &amp; Events</text>
  <rect x="726" y="78" width="105" height="3" rx="1.5" fill="#e96812"/>
  <text class="nav" x="860" y="57">Documentation</text>
  <text class="nav" x="1000" y="57">Get Involved</text>
  <text class="nav" x="1118" y="57">FAQ</text>
  <rect x="1195" y="31" width="162" height="42" rx="8" fill="#0078c8"/>
  <circle cx="1218" cy="52" r="9" fill="#ffffff"/>
  <text class="button-text" x="1236" y="56">GitHub</text>

  <!-- Compact page intro -->
  <rect x="0" y="100" width="1440" height="224" fill="#193967"/>
  <text class="eyebrow" x="100" y="153">STAY UP TO DATE</text>
  <text class="hero-title" x="100" y="207">News &amp; Events</text>
  <text class="hero-copy" x="100" y="246">Upcoming events, conferences, and conversations across the Eclipse S-CORE community.</text>
  <text class="hero-copy" x="100" y="270">Browse the live event listings or switch to past events.</text>
  <rect x="0" y="321" width="1440" height="4" fill="#e96812"/>

  <!-- Existing sibling destinations remain the page-level navigation -->
  <rect x="0" y="325" width="1440" height="72" fill="#ffffff"/>
  <text class="tab-active" x="100" y="369">Conferences</text>
  <rect x="96" y="393" width="107" height="4" rx="2" fill="#e96812"/>
  <text class="tab" x="260" y="369">Press Releases</text>
  <text class="tab" x="440" y="369">Articles &amp; News</text>
  <text class="tab" x="640" y="369">Townhalls</text>
  <line x1="0" y1="396" x2="1440" y2="396" stroke="#d9e3ec"/>

  <!-- One source of truth: feed filters and event list -->
  <text class="section-title" x="100" y="461">Conferences &amp; events</text>
  <text class="section-copy" x="100" y="487">Event listings are provided by the Eclipse Foundation.</text>

  <rect x="100" y="520" width="180" height="42" rx="6" fill="#b84a00"/>
  <text class="button-text" x="132" y="546">Upcoming Events</text>
  <rect x="280" y="520" width="150" height="42" rx="6" fill="#ffffff" stroke="#d6e1eb"/>
  <text x="314" y="546" fill="#234a78" font-size="12" font-weight="700">Past Events</text>

  <!-- Feed event card 1 -->
  <rect x="100" y="590" width="604" height="220" rx="9" fill="#ffffff" stroke="#dbe5ed" filter="url(#card-shadow)"/>
  <rect x="100" y="590" width="6" height="220" rx="3" fill="#e96812"/>
  <rect x="128" y="615" width="126" height="24" rx="12" fill="#fff0e4"/>
  <text x="145" y="631" fill="#b84a00" font-size="10" font-weight="800" letter-spacing="1">UPCOMING</text>
  <text class="event-date" x="128" y="671">06—08 OCTOBER 2026</text>
  <text class="event-title" x="128" y="705">Eclipse SDV Hackathon Chapter Four</text>
  <circle cx="134" cy="733" r="4" fill="#0078c8"/>
  <text class="event-location" x="147" y="737">Friedrichshafen, Germany</text>
  <text class="event-copy" x="128" y="765">Use current Eclipse SDV projects to solve real automotive challenges.</text>
  <text x="128" y="791" fill="#b84a00" font-size="11" font-weight="800">See details →</text>

  <!-- Feed event card 2 -->
  <rect x="736" y="590" width="604" height="220" rx="9" fill="#ffffff" stroke="#dbe5ed" filter="url(#card-shadow)"/>
  <rect x="736" y="590" width="6" height="220" rx="3" fill="#0078c8"/>
  <rect x="764" y="615" width="126" height="24" rx="12" fill="#e8f3fa"/>
  <text x="781" y="631" fill="#0078c8" font-size="10" font-weight="800" letter-spacing="1">CONFERENCE</text>
  <text class="event-date" x="764" y="671">13—15 APRIL 2027</text>
  <text class="event-title" x="764" y="705">Open Community Experience 2027</text>
  <circle cx="770" cy="733" r="4" fill="#0078c8"/>
  <text class="event-location" x="783" y="737">Brussels, Belgium</text>
  <text class="event-copy" x="764" y="765">Developers, architects, maintainers, and open-source builders meet.</text>
  <text x="764" y="791" fill="#b84a00" font-size="11" font-weight="800">See details →</text>

  <!-- Feed pagination -->
  <line x1="100" y1="852" x2="1340" y2="852" stroke="#d6e1eb"/>
  <rect x="1225" y="870" width="38" height="36" rx="5" fill="#ffffff" stroke="#d6e1eb"/>
  <text x="1244" y="894" text-anchor="middle" fill="#234a78" font-size="16" font-weight="700">‹</text>
  <rect x="1271" y="870" width="38" height="36" rx="5" fill="#b84a00"/>
  <text x="1290" y="893" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">1</text>
  <rect x="1317" y="870" width="38" height="36" rx="5" fill="#ffffff" stroke="#d6e1eb"/>
  <text x="1336" y="894" text-anchor="middle" fill="#234a78" font-size="16" font-weight="700">›</text>

  <rect x="0" y="1000" width="1440" height="120" fill="#193967"/>
  <text x="100" y="1065" fill="#ffffff" font-size="12" font-weight="700">Copyright © Eclipse Foundation AISBL</text>
  <text x="1110" y="1065" fill="#ffffff" font-size="11" font-weight="600">Terms</text>
  <text x="1180" y="1065" fill="#ffffff" font-size="11" font-weight="600">Privacy</text>
  <text x="1270" y="1065" fill="#ffffff" font-size="11" font-weight="600">Legal</text>
</svg>